name: 每日晚寝自动签到

on:
  schedule:
    # 北京时间 21:30 主签到；22:00、22:30 为兜底（UTC 13:30 / 14:00 / 14:30）
    - cron: '30 13 * * *'
    - cron: '0 14 * * *'
    - cron: '30 14 * * *'
  # 支持在 Actions 页面手动触发，便于测试
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行晚寝签到
        env:
          STUDENT_ID: ${{ secrets.STUDENT_ID }}
          STUDENT_PASSWORD: ${{ secrets.STUDENT_PASSWORD }}
        run: python main.py
